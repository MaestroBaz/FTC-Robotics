<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vote cards A B C</title>
<style>
  body{margin:0; font-family:"Arial Narrow", Arial, sans-serif;}
  .card{height:100vh; display:grid; place-items:center; page-break-after:always; border:6px solid #18202c; box-sizing:border-box;}
  .card b{font-size:70vh; line-height:1; color:#18202c;}
  .card small{position:absolute; bottom:4vh; font-size:4vh; color:#5a6474;}
  @media print{ .card{height:100vh;} }
</style>
</head>
<body>
<div class="card"><b>A</b><small>FTC Java Crash Course</small></div>
<div class="card"><b>B</b><small>FTC Java Crash Course</small></div>
<div class="card"><b>C</b><small>FTC Java Crash Course</small></div>
</body>
</html>
